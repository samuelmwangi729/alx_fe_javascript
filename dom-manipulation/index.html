<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dynamic Quote Generator with Filtering</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Dynamic Quote Generator</h1>

  <!-- Category Filter -->
  <label for="categoryFilter">Filter by Category:</label>
  <select id="categoryFilter" onchange="filterQuotes()">
    <option value="all">All Categories</option>
    <!-- Dynamically populated -->
  </select>

  <!-- Quote Display -->
  <div id="quoteDisplay"></div>

  <!-- Add Quote Form -->
  <h2>Add a New Quote</h2>
  <form id="addQuoteForm" onsubmit="addQuote(event)">
    <input type="text" id="quoteText" placeholder="Enter quote" required>
    <input type="text" id="quoteAuthor" placeholder="Enter author" required>
    <input type="text" id="quoteCategory" placeholder="Enter category" required>
    <button type="submit">Add Quote</button>
  </form>

  <script src="script.js"></script>
</body>
</html>
