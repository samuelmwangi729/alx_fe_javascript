<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dynamic Quote Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Dynamic Quote Generator</h1>

    <div id="quote-display">
      <p id="quote-text">Click below to load a quote!</p>
      <p id="quote-author"></p>
    </div>

    <button id="new-quote">Get New Quote</button>

    <h2>Add a New Quote</h2>
    <form id="add-quote-form">
      <input type="text" id="quote-input" placeholder="Enter quote" required>
      <input type="text" id="author-input" placeholder="Enter author" required>
      <button type="submit">Add Quote</button>
    </form>

    <div id="notifications"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
